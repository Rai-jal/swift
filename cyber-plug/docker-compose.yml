services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberplug
      POSTGRES_PASSWORD: cyberplug
      POSTGRES_DB: cyberplug
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberplug -d cyberplug"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ── Required ──────────────────────────────────────────────────────────
      # Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      API_KEY: ${API_KEY:?API_KEY is required — see README}

      # ── Database (points to the db service above) ─────────────────────────
      DATABASE_URL: postgresql://cyberplug:cyberplug@db:5432/cyberplug

      # ── CORS — nginx sits in front so only internal traffic reaches the app.
      # Frontend requests arrive via the nginx proxy on the same origin, so
      # CORS headers are not needed for browser traffic. Leave as [] unless
      # you have another external client calling the API directly.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}

      # ── LLM enrichment (optional — set to "claude" or "openai" to enable) ─
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}

      # ── Scan engine — Trivy ───────────────────────────────────────────────
      TRIVY_TIMEOUT: ${TRIVY_TIMEOUT:-300}
      CLONE_BASE_DIR: /tmp/cyberplug

      # ── Scan engine — Semgrep (SAST) ─────────────────────────────────────
      # Semgrep is installed in the image and runs automatically.
      SEMGREP_TIMEOUT: ${SEMGREP_TIMEOUT:-180}

      # ── Scan engine — Gitleaks (secrets) ─────────────────────────────────
      # Gitleaks binary is installed in the image and runs automatically.
      GITLEAKS_TIMEOUT: ${GITLEAKS_TIMEOUT:-120}

      # ── Scan engine — OWASP ZAP (dynamic/API) ────────────────────────────
      # ZAP runs as a separate service (see below). Enable with:
      #   docker compose --profile zap up --build
      # Then set ZAP_API_URL in your .env (or leave empty to disable ZAP).
      ZAP_API_URL: ${ZAP_API_URL:-}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      ZAP_TIMEOUT: ${ZAP_TIMEOUT:-300}

      # ── App ───────────────────────────────────────────────────────────────
      DEBUG: ${DEBUG:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      # ── URLs — set these to your real domain in .env ──────────────────────
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost}

      # ── Email ─────────────────────────────────────────────────────────────
      EMAIL_FROM: ${EMAIL_FROM:-noreply@cyberplug.io}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      # ── Google OAuth ──────────────────────────────────────────────────────
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # ── GitHub ────────────────────────────────────────────────────────────
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      # ── Billing ───────────────────────────────────────────────────────────
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      PAYSTACK_PRO_AMOUNT: ${PAYSTACK_PRO_AMOUNT:-4900}
      PAYSTACK_ENTERPRISE_AMOUNT: ${PAYSTACK_ENTERPRISE_AMOUNT:-0}
      PAYSTACK_CURRENCY: ${PAYSTACK_CURRENCY:-USD}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app

  # ── OWASP ZAP — optional dynamic scanner ─────────────────────────────────
  # Activate with:  docker compose --profile zap up --build
  # Then set in .env:  ZAP_API_URL=http://zap:8080
  #
  # ZAP requires 60–90 s to initialise. The healthcheck below prevents the
  # app from hitting ZAP before it is ready (for scans submitted at startup).
  zap:
    profiles: ["zap"]
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    command: >
      zap.sh -daemon
      -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/JSON/core/view/version/ > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

volumes:
  postgres_data:
